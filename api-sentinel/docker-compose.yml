services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: apisentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel_dev
    ports: ["5433:5432"]
    volumes: [sentinel_db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d apisentinel"]
      interval: 5s
      timeout: 3s
      retries: 15
  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/apisentinel
      SPRING_DATASOURCE_USERNAME: sentinel
      SPRING_DATASOURCE_PASSWORD: sentinel_dev
      APP_CORS_ALLOWED_ORIGINS: http://localhost:5174
    ports: ["8081:8081"]
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports: ["5174:5174"]
    depends_on: [backend]
volumes:
  sentinel_db:
